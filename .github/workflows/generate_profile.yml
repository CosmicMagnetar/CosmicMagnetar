name: Generate Profile Card

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
    paths:
      - "generate_profile.py"
      - ".github/workflows/generate_profile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Build SVG Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Add specific libraries if they aren't in requirements.txt
          # pip install requests 

      - name: Generate Profile Card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_profile.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-card.svg
          
          # Only commit and push if the file actually changed
          if git diff --cached --quiet; then
            echo "No changes detected in profile-card.svg"
          else
            git commit -m "chore: update profile card"
            git pull --rebase origin main
            git push
          fi